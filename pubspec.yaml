name: masroufi
description: "Masroufi — Tunisian offline-first personal finance (مصروفي)."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.2
  uuid: ^4.6.0
  csv: ^6.0.0
  file_picker: ^12.2.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  home_widget: ^0.9.4
  crypto: ^3.0.7
  pdf: ^3.11.3
  printing: ^5.14.2
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.0
  sqlite3: ^3.4.0 # migration tests only: builds v1-shaped files

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/OFL.txt
    - assets/fonts/plex/OFL.txt
  fonts:
    - family: PlexSans
      fonts:
        - asset: assets/fonts/plex/IBMPlexSans.ttf
          weight: 100
        - asset: assets/fonts/plex/IBMPlexSans.ttf
          weight: 200
        - asset: assets/fonts/plex/IBMPlexSans.ttf
          weight: 300
        - asset: assets/fonts/plex/IBMPlexSans.ttf
          weight: 400
        - asset: assets/fonts/plex/IBMPlexSans.ttf
          weight: 500
        - asset: assets/fonts/plex/IBMPlexSans.ttf
          weight: 600
        - asset: assets/fonts/plex/IBMPlexSans.ttf
          weight: 700
        - asset: assets/fonts/plex/IBMPlexSans.ttf
          weight: 800
        - asset: assets/fonts/plex/IBMPlexSans.ttf
          weight: 900
